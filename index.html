<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhiteFlaw's blog</title>

    <!-- CDN 预连接：让浏览器在解析 HTML 时就完成 DNS + TLS 握手，
         等真正去拉 Vue 等库时省掉一次往返。域名与顺序对应
         package/build_cdn.ts 里 backupCdnKeys 的前三项。
         必须带 crossorigin —— 这些脚本按 CORS 方式加载，
         不带的话浏览器会另建一条连接，预连接就白做了。 -->
    <link rel="preconnect" href="https://jsdelivr.topthink.com" crossorigin />
    <link rel="preconnect" href="https://cdn.liumingye.cn" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WhiteFlaw's blog",
      "url": "https://whiteflaw.github.io",
    }
    </script>
    
    <!-- PWA Manifest -->
    <% if (process.env.NODE_ENV === 'production') { %>
    <link rel="manifest" href="/manifest.webmanifest">
    <% } %>
    <meta name="theme-color" content="#0a0514"/>
  </head>
    <style>
      /* 开屏（首屏加载）配色：背景取暗色主题的深空底色 #0a0514，
         这样加载完成切进页面时不会出现颜色跳变。
         想改回浅色开屏：--background-color 换回 #f8fafc、
         --text-color 换回 #374151 即可。 */
      :root {
        --primary-color: #7c3aed;
        --secondary-color: #22d3ee;
        --background-color: #0a0514;
        --text-color: #e5e7eb;
        --loader-size: 80px;
        --transition-duration: 0.3s;
      }

      html, body, #app {
        height: 100%;
        margin: 0;
        padding: 0;
        color: var(--text-color);
        font-family: 'Courier New', monospace;
      }

      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: var(--background-color);
        flex-direction: column;
      }

      .logo {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
        box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
      }

      .logo span {
        color: white;
        font-size: 24px;
        font-weight: bold;
      }

      .loader {
        width: var(--loader-size);
        height: var(--loader-size);
        border: 5px solid rgba(255, 255, 255, 0.12);
        border-top: 5px solid var(--primary-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 20px;
        font-size: 16px;
        color: var(--text-color);
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .dots {
        display: inline-block;
        width: 20px;
      }

      .dots::after {
        content: '.';
        animation: dots 1.5s infinite;
      }

      @keyframes dots {
        0%, 20% { content: '.'; }
        40% { content: '..'; }
        60%, 100% { content: '...'; }
      }

      /* 响应式适配 */
      @media (max-width: 768px) {
        .logo {
          width: 50px;
          height: 50px;
          margin-bottom: 20px;
        }
        
        .logo span {
          font-size: 20px;
        }
        
        .loading-text {
          font-size: 14px;
        }
      }
    </style>
  <body>
      <div id="app">
          <div class="loading-container">
              <div class="logo">
                  <span>Wf</span>
              </div>
              <div class="loader"></div>
              <div class="loading-text">Loading<span class="dots"></span></div>
          </div>
      </div>
      <noscript>
          <div style="text-align: center">请开启 JavaScript</div>
      </noscript>
    <script type="module" src="/src/main.ts"></script>
  <script>  window.WF_BLOG_NAV_NAME = '<%= WF_BLOG_NAV_NAME %>';
  window.WF_BLOG_TREE_NAME = '<%= WF_BLOG_TREE_NAME %>';
  </script>
  <% if (cdn) { %>
  <script>
  <% for (const item of global_cdn) { %><%- item %>
  <% } %>
  // 定义资源列表
  const mainJs = [<% for (const item of mainJsList) { %>`<%= item %>`,<% } %>];
  const cssResources = [<% for (const item of cssList) { %>`<%= item %>`,<% } %>];
  const jsResources = [<% for (const item of jsList) { %>`<%= item %>`,<% } %>];
  </script>
  <script replace />
  <% } %>
  <script>
  (function() {
    let progress = 0;
    const loadingText = document.querySelector('.loading-text');
    const loadingTexts = ['Loading.', 'Loading..', 'Loading...'];
    let textIndex = 0;
    
    if (loadingText) {
      const updateText = () => {
        textIndex = (textIndex + 1) % loadingTexts.length;
        // We'll keep the animated dots but update for variety
        setTimeout(updateText, 1500);
      };
      updateText();
    }
  })();

  </script>
  <script>
  // 控制台彩蛋。放在这里而不是 main.ts：生产构建的 terser 开了 drop_console，
  // 打包进 JS 的 console.log 会被删掉，内联脚本则原样保留。
  console.log(
    '%c雄关漫道真如铁，\n而今迈步从头越。',
    'color:#a78bfa;font-size:15px;font-weight:700;line-height:1.5'
  );
  </script>
  </body>
</html>
